<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Vivi Lim - Full Day Content Plan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .post-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        .post-card.hidden {
            opacity: 0.3;
            transform: scale(0.98);
        }

        .post-card.hidden .post-content {
            display: none;
        }

        .post-time {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .post-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #764ba2;
            margin-bottom: 6px;
            margin-top: 14px;
        }

        .caption-box, .prompt-box {
            background: #f8f6ff;
            border-left: 4px solid #764ba2;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #444;
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .prompt-box {
            border-left-color: #667eea;
            background: #f0f4ff;
        }

        .pinterest-links {
            margin-top: 10px;
        }

        .pinterest-links a {
            display: inline-block;
            background: #e60023;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            text-decoration: none;
            margin-right: 6px;
            margin-bottom: 6px;
            transition: background 0.2s;
        }

        .pinterest-links a:hover {
            background: #ad081b;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .btn-copy {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy-caption {
            background: #764ba2;
            color: white;
        }

        .btn-copy-caption:hover {
            background: #5a3580;
        }

        .btn-copy-prompt {
            background: #667eea;
            color: white;
        }

        .btn-copy-prompt:hover {
            background: #4a5fd4;
        }

        .btn-hide {
            background: #f0f0f0;
            color: #666;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-hide:hover {
            background: #ddd;
        }

        .btn-copy.copied {
            background: #27ae60 !important;
        }

        .post-link {
            display: inline-block;
            margin-top: 8px;
            color: #1877f2;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .post-link:hover {
            text-decoration: underline;
        }

        .status-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-done {
            background: #d4edda;
            color: #155724;
        }

        .reset-btn {
            display: block;
            margin: 30px auto;
            padding: 12px 24px;
            background: white;
            color: #764ba2;
            border: 2px solid #764ba2;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #764ba2;
            color: white;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5rem;
            }
            .post-card {
                padding: 16px;
            }
        }
    </style>
</head>

        function getHiddenPosts() {
            const saved = localStorage.getItem('vivilim-hidden-posts');
            return saved ? JSON.parse(saved) : [];
        }

        function saveHiddenPosts(hidden) {
            localStorage.setItem('vivilim-hidden-posts', JSON.stringify(hidden));
        }

        function toggleHide(index) {
            const hidden = getHiddenPosts();
            const idx = hidden.indexOf(index);
            if (idx > -1) {
                hidden.splice(idx, 1);
            } else {
                hidden.push(index);
            }
            saveHiddenPosts(hidden);
            renderPosts();
        }



        function resetAll() {
            localStorage.removeItem('vivilim-hidden-posts');
            renderPosts();
        }

        function copyCaption(index) {
            const text = posts[index].caption.replace(/\\n/g, '\n');
            const btn = event.target;
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.textContent;
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function copyPrompt(index) {
            const text = posts[index].prompt;
            const btn = event.target;
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.textContent;
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            const hidden = getHiddenPosts();
            container.innerHTML = '';

            posts.forEach((post, index) => {
                const isHidden = hidden.includes(index);
                const card = document.createElement('div');
                card.className = `post-card ${isHidden ? 'hidden' : ''}`;

                let pinterestHTML = '';
                post.pinterest.forEach(pin => {
                    pinterestHTML += `<a href="${pin.url}" target="_blank" rel="noopener">${pin.label}</a>`;
                });

                card.innerHTML = `
                    <span class="status-badge ${isHidden ? 'status-done' : 'status-pending'}">${isHidden ? 'Done' : 'Pending'}</span>
                    <span class="post-time">${post.time}</span>
                    <div class="post-title">${post.title}</div>
                    <div class="post-content">
                        <div class="section-label">Caption FB</div>
                        <div class="caption-box">${post.caption}</div>

                        <div class="section-label">Image Prompt</div>
                        <div class="prompt-box">${post.prompt}</div>

                        <div class="section-label">Pinterest References</div>
                        <div class="pinterest-links">${pinterestHTML}</div>

                        <div class="btn-row">
                            <button class="btn-copy btn-copy-caption" onclick="copyCaption(${index})">Copy Caption</button>
                            <button class="btn-copy btn-copy-prompt" onclick="copyPrompt(${index})">Copy Prompt</button>
                            <button class="btn-hide" onclick="toggleHide(${index})">${isHidden ? 'Show Task' : 'Hide Task (Done)'}</button>
                        </div>
                    </div>
                    ${isHidden ? '<div style="margin-top:10px;"><button class="btn-hide" onclick="toggleHide(' + index + ')">Show Task</button></div>' : ''}
                `;

                container.appendChild(card);
            });
        }

        renderPosts();
    </script>
