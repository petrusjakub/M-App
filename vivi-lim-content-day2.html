            {

        function getStorageKey() {
            return 'vivilim-day2-hidden-posts';
        }

        function getHiddenPosts() {
            const saved = localStorage.getItem(getStorageKey());
            return saved ? JSON.parse(saved) : [];
        }

        function saveHiddenPosts(hidden) {
            localStorage.setItem(getStorageKey(), JSON.stringify(hidden));
        }

        function toggleHide(index) {
            const hidden = getHiddenPosts();
            const idx = hidden.indexOf(index);
            if (idx > -1) {
                hidden.splice(idx, 1);
            } else {
                hidden.push(index);
            }
            saveHiddenPosts(hidden);
            renderPosts();
        }

        function resetAll() {
            localStorage.removeItem(getStorageKey());
            renderPosts();
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(function() {
                var original = btn.textContent;
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(function() {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(function() {
                // Fallback for older browsers
                var textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                var original = btn.textContent;
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(function() {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function copyCaption(index, btn) {
            var text = posts[index].caption;
            copyText(text, btn);
        }

        function copyPrompt(index, btn) {
            var text = posts[index].prompt;
            copyText(text, btn);
        }

        function renderNav() {
            var navBar = document.getElementById('nav-bar');
            navBar.innerHTML = '';
            posts.forEach(function(post, index) {
                var link = document.createElement('a');
                link.className = 'nav-btn';
                link.href = '#post-' + index;
                link.textContent = post.time + ' ' + post.title.split(' - ')[0].substring(0, 12);
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    var target = document.getElementById('post-' + index);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
                navBar.appendChild(link);
            });
        }

        function renderPosts() {
            var container = document.getElementById('posts-container');
            var hidden = getHiddenPosts();
            container.innerHTML = '';

            posts.forEach(function(post, index) {
                var isHidden = hidden.includes(index);
                var card = document.createElement('div');
                card.className = 'post-card' + (isHidden ? ' hidden' : '');
                card.id = 'post-' + index;

                var pinterestHTML = '';
                post.pinterest.forEach(function(pin) {
                    pinterestHTML += '<a href="' + pin.url + '" target="_blank" rel="noopener">' + pin.label + '</a>';
                });

                card.innerHTML =
                    '<span class="status-badge ' + (isHidden ? 'status-done' : 'status-pending') + '">' + (isHidden ? 'Done' : 'Pending') + '</span>' +
                    '<span class="post-time">' + post.time + '</span>' +
                    '<div class="post-title">' + post.title + '</div>' +
                    '<div class="post-content">' +
                        '<div class="section-label">Caption FB</div>' +
                        '<div class="caption-box">' + post.caption + '</div>' +
                        '<div class="section-label">Image Prompt</div>' +
                        '<div class="prompt-box">' + post.prompt + '</div>' +
                        '<div class="section-label">Pinterest References</div>' +
                        '<div class="pinterest-links">' + pinterestHTML + '</div>' +
                        '<div class="btn-row">' +
                            '<button class="btn-copy btn-copy-caption" onclick="copyCaption(' + index + ', this)">Copy Caption</button>' +
                            '<button class="btn-copy btn-copy-prompt" onclick="copyPrompt(' + index + ', this)">Copy Prompt</button>' +
                            '<button class="btn-hide" onclick="toggleHide(' + index + ')">Hide Task (Done)</button>' +
                        '</div>' +
                    '</div>' +
                    (isHidden ? '<div style="margin-top:10px;"><button class="btn-hide" onclick="toggleHide(' + index + ')">Show Task</button></div>' : '');

                container.appendChild(card);
            });
        }

        renderNav();
        renderPosts();
    </script>
